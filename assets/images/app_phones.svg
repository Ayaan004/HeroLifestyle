<svg width="420" height="340" viewBox="0 0 420 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="drop-shadow" x="-30" y="-20" width="480" height="380" filterUnits="userSpaceOnUse">
      <feDropShadow dx="6" dy="16" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="phone-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Left Phone (Angled slightly) -->
  <g transform="translate(20, 20) rotate(-6)" filter="url(#drop-shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="155" height="280" rx="28" fill="url(#phone-frame)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Screen Inner -->
    <rect x="5" y="5" width="145" height="270" rx="24" fill="#ffffff"/>
    
    <!-- Dynamic Island / Speaker -->
    <rect x="55" y="10" width="45" height="9" rx="4.5" fill="#0f172a"/>
    
    <!-- App Header -->
    <rect x="14" y="26" width="32" height="7" rx="3.5" fill="#6366f1"/>
    <circle cx="134" cy="29" r="4" fill="#94a3b8"/>
    <circle cx="122" cy="29" r="4" fill="#94a3b8"/>

    <!-- Search Input -->
    <rect x="14" y="38" width="127" height="18" rx="9" fill="#f1f5f9"/>
    <circle cx="24" cy="47" r="3" fill="#94a3b8"/>
    <rect x="32" y="45" width="40" height="4" rx="2" fill="#cbd5e1"/>

    <!-- Promo Banner in App -->
    <rect x="14" y="62" width="127" height="52" rx="10" fill="url(#screen-purple)"/>
    <rect x="22" y="72" width="55" height="6" rx="3" fill="#ffffff"/>
    <rect x="22" y="82" width="40" height="4" rx="2" fill="rgba(255,255,255,0.7)"/>
    <rect x="22" y="92" width="30" height="12" rx="6" fill="#ffffff"/>
    <!-- Mini Graphic on Banner -->
    <circle cx="112" cy="88" r="16" fill="rgba(255,255,255,0.2)"/>
    <circle cx="112" cy="88" r="10" fill="#ffffff"/>

    <!-- Categories Row -->
    <circle cx="26" cy="126" r="9" fill="#f1f5f9"/>
    <circle cx="52" cy="126" r="9" fill="#f1f5f9"/>
    <circle cx="78" cy="126" r="9" fill="#f1f5f9"/>
    <circle cx="104" cy="126" r="9" fill="#f1f5f9"/>
    <circle cx="130" cy="126" r="9" fill="#f1f5f9"/>

    <!-- Product Card 1 -->
    <rect x="14" y="143" width="60" height="78" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <rect x="20" y="149" width="48" height="36" rx="6" fill="#e2e8f0"/>
    <circle cx="44" cy="167" r="10" fill="#6366f1" opacity="0.2"/>
    <rect x="20" y="190" width="36" height="4" rx="2" fill="#1e293b"/>
    <rect x="20" y="197" width="20" height="4" rx="2" fill="#6366f1"/>
    <circle cx="63" cy="209" r="7" fill="#6366f1"/>

    <!-- Product Card 2 -->
    <rect x="81" y="143" width="60" height="78" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
    <rect x="87" y="149" width="48" height="36" rx="6" fill="#e2e8f0"/>
    <circle cx="111" cy="167" r="10" fill="#8b5cf6" opacity="0.2"/>
    <rect x="87" y="190" width="36" height="4" rx="2" fill="#1e293b"/>
    <rect x="87" y="197" width="20" height="4" rx="2" fill="#6366f1"/>
    <circle cx="130" cy="209" r="7" fill="#6366f1"/>

    <!-- Bottom Nav Bar -->
    <rect x="14" y="230" width="127" height="36" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
    <circle cx="32" cy="248" r="4" fill="#6366f1"/>
    <circle cx="60" cy="248" r="4" fill="#94a3b8"/>
    <circle cx="88" cy="248" r="4" fill="#94a3b8"/>
    <circle cx="116" cy="248" r="4" fill="#94a3b8"/>
    <!-- Home bar -->
    <rect x="55" y="268" width="45" height="3" rx="1.5" fill="#cbd5e1"/>
  </g>

  <!-- Right Phone (Angled slightly right, overlapping) -->
  <g transform="translate(170, 15) rotate(4)" filter="url(#drop-shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="155" height="280" rx="28" fill="url(#phone-frame)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Screen Inner -->
    <rect x="5" y="5" width="145" height="270" rx="24" fill="#ffffff"/>

    <!-- Dynamic Island / Speaker -->
    <rect x="55" y="10" width="45" height="9" rx="4.5" fill="#0f172a"/>

    <!-- Product Detail Header -->
    <circle cx="22" cy="29" r="5" fill="#f1f5f9"/>
    <rect x="18" y="28" width="8" height="2" fill="#475569"/>
    <circle cx="133" cy="29" r="5" fill="#fee2e2"/>
    <circle cx="133" cy="29" r="2.5" fill="#ef4444"/>

    <!-- Product Main Showcase -->
    <rect x="14" y="42" width="127" height="105" rx="12" fill="#f8fafc"/>
    <!-- Glow behind product -->
    <circle cx="77" cy="90" r="35" fill="url(#screen-purple)" opacity="0.15"/>
    <!-- Product Graphic (Headphones) -->
    <circle cx="77" cy="88" r="24" fill="none" stroke="#1e293b" stroke-width="4"/>
    <rect x="50" y="80" width="10" height="22" rx="5" fill="#6366f1"/>
    <rect x="94" y="80" width="10" height="22" rx="5" fill="#6366f1"/>

    <!-- Pagination Dots -->
    <circle cx="69" cy="154" r="2" fill="#cbd5e1"/>
    <circle cx="77" cy="154" r="3" fill="#6366f1"/>
    <circle cx="85" cy="154" r="2" fill="#cbd5e1"/>

    <!-- Details -->
    <rect x="14" y="164" width="90" height="7" rx="3.5" fill="#0f172a"/>
    <rect x="14" y="175" width="55" height="4" rx="2" fill="#94a3b8"/>
    <!-- Rating Stars -->
    <rect x="14" y="184" width="38" height="4" rx="2" fill="#f59e0b"/>
    <rect x="56" y="184" width="25" height="4" rx="2" fill="#94a3b8"/>

    <!-- Price -->
    <rect x="14" y="197" width="45" height="9" rx="4.5" fill="#6366f1"/>

    <!-- Add To Cart Big Button -->
    <rect x="14" y="216" width="127" height="30" rx="10" fill="url(#screen-purple)"/>
    <rect x="45" y="229" width="65" height="4" rx="2" fill="#ffffff"/>

    <!-- Home bar -->
    <rect x="55" y="268" width="45" height="3" rx="1.5" fill="#cbd5e1"/>
  </g>
</svg>
